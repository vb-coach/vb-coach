[project]
name = "vb-coach"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Siriux Yu", email = "hengjia.y@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
]

[project.scripts]
vb-coach = "vb_coach:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
